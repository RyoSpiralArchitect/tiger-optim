name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[bench]"

      - name: Run CPU benchmark smoke
        run: |
          python benchmarks/bench_compare_optim.py \
            --device cpu \
            --steps 8 \
            --warmup 2 \
            --modes adamw tiger_v13_compat tiger_v21_full

      - name: Summarize benchmark results
        run: |
          python benchmarks/summarize_results.py \
            --pattern "benchmarks/results/compare-*.json" \
            --markdown-out benchmarks/results/summary.md \
            --emit-github-summary

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results/*.json
            benchmarks/results/summary.md
          if-no-files-found: error
