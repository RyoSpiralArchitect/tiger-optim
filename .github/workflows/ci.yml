name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build --sdist --wheel

      - name: Smoke test installed wheel
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/tiger-wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/tiger-wheel" python - <<'PY'
          import os
          from importlib import metadata
          from pathlib import Path
          import tiger_optim

          root = (Path(os.environ["RUNNER_TEMP"]) / "tiger-wheel").resolve()
          assert Path(tiger_optim.__file__).resolve().is_relative_to(root)
          assert tiger_optim.__version__ == "2.4.0"
          wheel = next(
              dist for dist in metadata.distributions(path=[str(root)])
              if dist.metadata["Name"] == "tiger-optim"
          )
          assert wheel.metadata["License-Expression"] == "AGPL-3.0-only"
          PY

  benchmark-smoke:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[bench]"

      - name: Run CPU benchmark smoke
        run: |
          python benchmarks/bench_compare_optim.py \
            --device cpu \
            --steps 8 \
            --warmup 2 \
            --modes adamw tiger_v13_compat tiger_v21_full

      - name: Summarize benchmark results
        run: |
          python benchmarks/summarize_results.py \
            --pattern "benchmarks/results/compare-*.json" \
            --markdown-out benchmarks/results/summary.md \
            --emit-github-summary

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmarks/results/*.json
            benchmarks/results/summary.md
          if-no-files-found: error
