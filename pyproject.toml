
[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiger-optim"
version = "2.4.0"
description = "Tiger Optimizer (PyTorch) — v2.4.0"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [{name="SpiralReality"}]
dependencies = ["torch>=1.13"]

[project.optional-dependencies]
julia = [
    "numpy>=1.26",
    "juliacall>=0.9.24",
]
bench = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
